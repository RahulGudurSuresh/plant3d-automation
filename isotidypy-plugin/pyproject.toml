[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isotidypy"
version = "1.0.0"
description = "Tidy ISOGEN isometric annotations: DWG in, DWG out, no AutoCAD needed"
requires-python = ">=3.10"
dependencies = [
    "ezdxf==1.4.4",
    "shapely==2.1.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pillow>=10",
    "fonttools>=4.50",
    "pytest>=8",
]

[project.scripts]
isotidypy = "isotidypy.cli:main"

[tool.setuptools]
packages = ["isotidypy", "isotidy", "tools"]
